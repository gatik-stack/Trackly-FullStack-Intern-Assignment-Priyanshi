services:
  postgres:
    image: postgres:16
    container_name: trackly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackly
      POSTGRES_PASSWORD: trackly
      POSTGRES_DB: trackly
    ports:
      - "5432:5432"
    volumes:
      - trackly-postgres-data:/var/lib/postgresql/data

volumes:
  trackly-postgres-data: